<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PotholeSense — Capture</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#161d26; --line:#26313d;
    --text:#e6edf3; --muted:#8b98a5;
    --accent:#4ade80; --warn:#fbbf24; --danger:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none}
  #stage{position:relative;width:100%;height:62vh;background:#000;overflow:hidden}
  video,canvas#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  canvas#overlay{pointer-events:none}
  #badge{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:999px;
    background:rgba(0,0,0,.6);backdrop-filter:blur(8px);font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:8px}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  #dot.live{background:var(--danger);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  #hit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(28px,9vw,56px);font-weight:800;color:var(--danger);
    text-shadow:0 2px 16px #000;opacity:0;transition:opacity .15s}
  #hit.show{opacity:1}
  .wrap{padding:14px;display:flex;flex-direction:column;gap:12px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px;text-align:center}
  .stat b{display:block;font-size:22px;line-height:1.1}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  button{width:100%;padding:16px;border:0;border-radius:14px;font-size:17px;
    font-weight:700;color:#04120a;background:var(--accent)}
  button.stop{background:var(--danger);color:#1a0505}
  button:disabled{opacity:.4}
  #log{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px;font-size:12px;color:var(--muted);max-height:22vh;overflow:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  a{color:var(--accent)}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--muted)}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mode{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px;font-size:13px;display:block;cursor:pointer}
  .mode:has(input:checked){border-color:var(--accent)}
  .mode:has(input:disabled){opacity:.45;cursor:not-allowed}
  .mode input{margin:0 6px 0 0}
  .mode b{font-weight:700}
  .mode span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  #queued:not(:empty){color:var(--warn);font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="badge"><span id="dot"></span><span id="state">idle</span></div>
  <div id="hit">POTHOLE</div>
</div>

<div class="wrap">
  <div class="grid">
    <div class="stat"><b id="s-found">0</b><span>potholes</span></div>
    <div class="stat"><b id="s-fps">0.0</b><span>fps</span></div>
    <div class="stat"><b id="s-ms">—</b><span>infer ms</span></div>
  </div>
  <div class="row">
    <span id="gps">GPS: waiting…</span>
    <a href="/dashboard" target="_blank">Open map ↗</a>
  </div>

  <div class="modes">
    <label class="mode"><input type="radio" name="mode" value="ondevice" checked>
      <b>On this phone</b><span>No laptop needed. Works with no signal.</span></label>
    <label class="mode"><input type="radio" name="mode" value="server">
      <b>On the laptop</b><span>Streams frames over the network.</span></label>
  </div>
  <div class="row"><span id="modestate">Checking for an on-device model…</span>
    <span id="queued"></span></div>

  <button id="go">Start survey</button>
  <div id="log"><div>Ready. Mount the phone before starting.</div></div>
</div>

<script type="module">
import { OnDeviceDetector } from '/static/detector.js';
import * as queue from '/static/queue.js';

const $ = id => document.getElementById(id);
const video = $('cam'), overlay = $('overlay'), octx = overlay.getContext('2d');
const grab = document.createElement('canvas'), gctx = grab.getContext('2d');

const TARGET_FPS = 3;          // frames sent per second
const SEND_WIDTH = 640;        // downscale before upload
const JPEG_Q = 0.62;

let running = false, sessionId = null, stream = null, wakeLock = null;
let fix = null, watchId = null, inflight = false;
let sent = 0, fpsMark = performance.now(), fpsCount = 0;
const seen = new Set();

// On-device is the default when a model is available: it needs no laptop, no
// hotspot, and never uploads road imagery. Server mode remains for a phone
// too slow to run the network, and as the comparison for measuring what
// on-device inference costs in latency.
let mode = 'ondevice';
let detector = null, localPotholes = 0, queuedCount = 0;
const modeState = $('modestate');

function log(msg){
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  $('log').prepend(d);
  while ($('log').children.length > 60) $('log').lastChild.remove();
}

/* --- mode selection ---------------------------------------------------- */
async function probeOnDevice(){
  const radios = [...document.querySelectorAll('input[name=mode]')];
  const onDeviceRadio = radios.find(r => r.value === 'ondevice');
  try {
    const info = await fetch('/api/ondevice').then(r => r.json());
    if (!info.available){
      onDeviceRadio.disabled = true;
      radios.find(r => r.value === 'server').checked = true;
      mode = 'server';
      modeState.textContent =
        'No on-device model yet — export ONNX from the notebook into models/';
      return;
    }
    detector = new OnDeviceDetector({
      modelUrl: info.model_url, confThreshold: info.conf_threshold });
    modeState.textContent =
      `Model ready (${(info.bytes/1e6).toFixed(1)} MB) — downloads once, then works offline`;
  } catch (e) {
    onDeviceRadio.disabled = true;
    mode = 'server';
    modeState.textContent = 'Could not reach the server to check for a model';
  }
}

document.querySelectorAll('input[name=mode]').forEach(r => {
  r.onchange = () => { mode = r.value; };
});

async function ensureModelLoaded(){
  if (!detector || detector.ready) return;
  modeState.textContent = 'Loading model…';
  const info = await detector.load((got, total) => {
    modeState.textContent = total
      ? `Downloading model ${(100*got/total).toFixed(0)}%`
      : `Downloading model ${(got/1e6).toFixed(1)} MB`;
  });
  modeState.textContent =
    `Running on this phone · ${info.threads} thread${info.threads>1?'s':''}`;
}

async function updateQueued(){
  try {
    const { detections } = await queue.pending();
    queuedCount = detections.length;
    $('queued').textContent = queuedCount ? `${queuedCount} to upload` : '';
  } catch (e) { /* storage unavailable: the drive still works */ }
}

async function startCamera(){
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} },
    audio:false
  });
  video.srcObject = stream;
  await video.play();
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  log(`camera ${video.videoWidth}x${video.videoHeight}`);
}

function startGPS(){
  if(!navigator.geolocation){ log('ERROR no geolocation'); return; }
  watchId = navigator.geolocation.watchPosition(p => {
    fix = p.coords;
    $('gps').textContent =
      `GPS: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} ` +
      `(±${Math.round(p.coords.accuracy)}m)`;
  }, e => log('GPS error: ' + e.message),
     { enableHighAccuracy:true, maximumAge:1000, timeout:10000 });
}

function drawBoxes(dets, fw, fh){
  octx.clearRect(0,0,overlay.width,overlay.height);
  const sx = overlay.width/fw, sy = overlay.height/fh;
  octx.lineWidth = 4; octx.strokeStyle = '#f87171';
  octx.font = 'bold 20px sans-serif'; octx.fillStyle = '#f87171';
  dets.forEach(d => {
    const [x1,y1,x2,y2] = d.bbox;
    octx.strokeRect(x1*sx, y1*sy, (x2-x1)*sx, (y2-y1)*sy);
    octx.fillText(`${d.severity} ${d.confidence}`, x1*sx, Math.max(22, y1*sy - 8));
  });
}

function flash(){
  $('hit').classList.add('show');
  if (navigator.vibrate) navigator.vibrate(120);
  setTimeout(()=>$('hit').classList.remove('show'), 450);
}

/* --- the two survey paths ---------------------------------------------- */

/* On-device: infer here, keep the imagery on the phone, queue the result.
 * Nothing here needs the network, so the drive is unaffected by losing it. */
async function stepOnDevice(){
  const { boxes, inferenceMs, frameW, frameH } = await detector.detect(video);
  $('s-ms').textContent = inferenceMs.toFixed(0);
  drawBoxes(boxes.map(b => ({...b, severity: '', confidence: b.confidence.toFixed(2)})),
            frameW, frameH);

  await queue.queueTrackPoint({
    lat: fix.latitude, lon: fix.longitude, accuracy_m: fix.accuracy ?? null });

  for (const b of boxes){
    await queue.queueDetection({
      client_id: queue.newId(),
      lat: fix.latitude, lon: fix.longitude,
      x1: b.bbox[0], y1: b.bbox[1], x2: b.bbox[2], y2: b.bbox[3],
      frame_w: frameW, frame_h: frameH,
      confidence: b.confidence,
      accuracy_m: fix.accuracy ?? null,
      speed_mps: Number.isFinite(fix.speed) ? fix.speed : null,
      heading_deg: Number.isFinite(fix.heading) ? fix.heading : null,
    });
    localPotholes++;
    flash();
  }
  // Counted locally because deduplication happens server-side at sync: this
  // is raw sightings, and the map will show the true number of defects.
  $('s-found').textContent = localPotholes;
  await updateQueued();
}

/* Server: upload the frame and let the laptop run the model. */
async function stepServer(){
  const scale = SEND_WIDTH / video.videoWidth;
  grab.width = SEND_WIDTH; grab.height = Math.round(video.videoHeight*scale);
  gctx.drawImage(video, 0, 0, grab.width, grab.height);
  const blob = await new Promise(r => grab.toBlob(r, 'image/jpeg', JPEG_Q));

  const fd = new FormData();
  fd.append('image', blob, 'f.jpg');
  fd.append('lat', fix.latitude);
  fd.append('lon', fix.longitude);
  if (fix.accuracy != null) fd.append('accuracy_m', fix.accuracy);
  if (fix.speed != null && !isNaN(fix.speed)) fd.append('speed_mps', fix.speed);
  if (fix.heading != null && !isNaN(fix.heading)) fd.append('heading_deg', fix.heading);
  if (sessionId) fd.append('session_id', sessionId);

  const res = await fetch('/api/frame', { method:'POST', body: fd });
  if (res.status === 202) return;                 // GPS too coarse
  const data = await res.json();

  $('s-ms').textContent = data.inference_ms;
  drawBoxes(data.detections, data.frame.w, data.frame.h);

  data.detections.forEach(d => {
    if (d.new){
      seen.add(d.pothole_id);
      $('s-found').textContent = seen.size;
      flash();
      const rng = d.distance_m != null ? ` @${d.distance_m}m ahead` : '';
      const size = d.width_m != null ? `, ${d.width_m}m wide` : '';
      log(`NEW #${d.pothole_id} ${d.severity}${size}${rng}`);
    }
  });
}

async function sendFrame(){
  if (!running || inflight || !fix || video.readyState < 2) return;
  inflight = true;
  try{
    if (mode === 'ondevice') await stepOnDevice();
    else await stepServer();
    sent++; fpsCount++;
  } catch(err){
    log((mode === 'ondevice' ? 'inference failed: ' : 'upload failed: ') + err.message);
  } finally { inflight = false; }
}

setInterval(() => {
  const now = performance.now();
  if (now - fpsMark >= 1000){
    $('s-fps').textContent = (fpsCount * 1000/(now-fpsMark)).toFixed(1);
    fpsCount = 0; fpsMark = now;
  }
}, 1000);

async function start(){
  try{
    if (mode === 'ondevice') await ensureModelLoaded();
    await startCamera();
    startGPS();
    // A session id is only obtainable while the server is reachable. On-device
    // surveys start before the drive, in range; if the server cannot be
    // reached at all the survey still runs and syncs into a session created
    // at upload time.
    try{
      const fd = new FormData();
      fd.append('device', navigator.userAgent.slice(0,120));
      sessionId = (await (await fetch('/api/session/start',{method:'POST',body:fd})).json()).session_id;
    }catch(e){
      if (mode !== 'ondevice') throw e;
      sessionId = null;
      log('server unreachable — recording offline');
    }
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen').catch(()=>null);
    running = true;
    $('go').textContent = 'Stop survey'; $('go').classList.add('stop');
    $('dot').classList.add('live'); $('state').textContent = 'surveying';
    log(`session ${sessionId} started`);
    loop();
  }catch(e){ log('start failed: ' + e.message); }
}

function loop(){
  if(!running) return;
  sendFrame();
  setTimeout(loop, 1000/TARGET_FPS);
}

async function syncNow(){
  const b = $('go');
  try{
    await updateQueued();
    if (!queuedCount) return;
    b.disabled = true;
    log(`uploading ${queuedCount} detections…`);
    const r = await queue.flush(sessionId);
    log(`synced — ${r.accepted} recorded, ${r.duplicates||0} already had, `
        + `${r.potholes} distinct potholes`);
  }catch(err){
    log('sync failed, survey kept on the phone: ' + err.message);
  }finally{
    b.disabled = false;
    await updateQueued();
  }
}

async function stop(){
  running = false;
  if (sessionId) await fetch(`/api/session/${sessionId}/end`, {method:'POST'}).catch(()=>{});
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (wakeLock) { try{ await wakeLock.release(); }catch(e){} wakeLock = null; }
  octx.clearRect(0,0,overlay.width,overlay.height);
  $('go').textContent = 'Start survey'; $('go').classList.remove('stop');
  $('dot').classList.remove('live'); $('state').textContent = 'idle';
  log(`stopped — ${sent} frames, ${mode==='ondevice'?localPotholes:seen.size} sightings`);
  if (mode === 'ondevice') await syncNow();
}

$('go').onclick = () => running ? stop() : start();

// Cache the page, the runtime and the weights, so the next drive needs
// nothing but the phone. Registration is best-effort: a browser without
// service workers still surveys, it just cannot do so offline.
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
    .catch(err => log('offline mode unavailable: ' + err.message));
}

// A survey left unsynced from a previous drive uploads as soon as the phone
// is back in range of the server.
window.addEventListener('online', () => { if (!running) syncNow(); });

probeOnDevice();
updateQueued();
</script>
</body>
</html>
